
services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rsi_swing_bot
    ports:
      - "8000:8000"  # Prometheus metrics
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SIM_MODE=${SIM_MODE:-false}
      - BYBIT_TESTNET=${BYBIT_TESTNET:-true}
      - BYBIT_SYMBOLS=${BYBIT_SYMBOLS:-SOL/USDT}
    volumes:
      - ./data:/app/data  # Persistent data (trade logs, cluster state)
    restart: unless-stopped  # Auto-restart on crash or host reboot
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards # Mount directory for dashboard JSON files
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true # Optional: Enable anonymous access for easier viewing
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer # Optional: Set anonymous role
    depends_on:
      - prometheus