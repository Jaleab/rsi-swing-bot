
services:
  bot:
    build:
      context: .
      args:
        CACHE_BUSTER: ${CACHE_BUSTER_VALUE}
    container_name: trading_bot
    ports:
      - "8000:8000"
    env_file:
      - .env # This will pass environment variables from the host's .env file
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=DEBUG
      - SIM_MODE=true # Force SIM_MODE to true
      - BACKTEST_ENABLED=false
      - USE_SIM_EVENTS_GENERATOR=true
      - ORDERBOOK_WS_ENABLED=true
      - TRADES_WS_ENABLED=true
      - BYBIT_API_KEY=dummy_api_key
      - BYBIT_API_SECRET=dummy_api_secret
      - BYBIT_TESTNET=true
      - ENABLE_MANUAL_SWEEP_INJECTION=${ENABLE_MANUAL_SWEEP_INJECTION}
    command: ["python", "executor_bot.py", "--sim"]
    volumes:
      - .:/app # Mount the current directory into the container
    deploy:
      resources:
        limits:
          memory: 2048M # Increase memory limit to 2GB
    restart: "no" # Set to "no" during backtesting to avoid continuous restarts

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards # Mount directory for dashboard JSON files
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true # Optional: Enable anonymous access for easier viewing
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer # Optional: Set anonymous role
    depends_on:
      - prometheus